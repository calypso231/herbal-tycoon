function mkAdv(){const i=Math.floor(Math.random()*ADV.length);return{s:ADV[i].s,d:"약이 필요 없음",need:[],note:i,o:[0,1,2,3].sort(()=>Math.random()-.5)}}
function toggleMemo(){S.memo=!S.memo;render()}
function pickNote(i){S.notes[S.sel]=i;render()}
function closeNotice(){S.notice=false;S.seen3=true;save();render()}
function memoHTML(){const p=S.desk.find(x=>x.id===S.sel);let body;
 if(!p||p.sy.note===undefined)body=`<div style="padding:10px">이 손님은 약이 필요한 증상이에요.<br><small>당부는 약이 필요 없는 증상에만 적어요.</small></div>`;
 else{const a=ADV[p.sy.note],n=S.notes[p.id];
  body=`<div class="hw">${p.sp.n} · 증상: ${p.sy.s}</div><small>어떻게 하라고 당부할까요?</small>`+p.sy.o.map(i=>`<button class="op ${n===i?"sel":""}" onclick="pickNote(${i})">${a.o[i][0]}</button>`).join("")+`<div class="memo hw">${n===undefined?"<span style='opacity:.5'>(당부를 고르면 여기에 적혀요)</span>":`사니와의 당부<br>${p.sp.n}에게,<br>${a.o[n][1]}<br>- 사니와 -`}</div>`}
 return `<div class="modal" onclick="toggleMemo()"><div class="mbox" onclick="event.stopPropagation()"><div class="mh"><b>${ic("memo")} 사니와의 당부</b><button onclick="toggleMemo()">${ic("x")}</button></div>${body}</div></div>`}
function noticeHTML(){return `<div class="modal"><div class="mbox"><div class="mh"><b>${ic("notice")} 3일차부터 달라지는 점</b></div><div style="font-size:14px;line-height:1.6">· 약이 필요 없는 도검남사도 찾아와요. 처방서에 없는 증상(예: 잠이 오지 않음)이 적힌 처방전이 그 신호예요.<br>· 조제실의 <b>${ic("memo")} 메모장</b>에서 <b>‘사니와의 당부’</b>를 고르면 당부가 자동으로 적혀요.<br>· 당부를 적은 뒤 <b>돌려보내기</b>를 누르면 끝! 알맞은 당부를 적어야 해요.<br>· 이런 증상에 약을 쓰거나 당부가 틀리면 목숨이 줄어요.</div><button class="p" onclick="closeNotice()">알겠어요</button></div></div>`}
function restart(){if(MG)closeMG();S=JSON.parse(FRESH);fix();MENU=false;save();render()}
function overHTML(){return `<div class="modal"><div class="mbox"><div class="mh"><b>${ic("lantern")} 영업 종료</b></div><div style="margin:6px 0;line-height:1.6"><b>${yagen("",mood())} 야겐 토시로</b><br>“... 괜한 일을 시킨 모양이네. 이만 돌아가도 좋아. 수고했다.”</div><div class="box" style="margin:8px 0">버틴 날: ${S.day}일차<br>치료한 도검남사: ${S.cured||0}명</div><button class="p" onclick="restart()">처음부터 다시 시작</button><button style="width:100%;margin-top:6px" onclick="openMenu()">${ic("disk")} 저장 불러오기</button></div></div>`}
let MENU=false,MSG="",NG=false;
function openMenu(){MENU=true;MSG="";NG=false;render()}
function closeMenu(){MENU=false;render()}
function note2(t){const e=document.getElementById("msg2");if(e)e.textContent=t}
function slotInfo(i){try{const d=JSON.parse(localStorage.getItem("hyb3_s"+i));return d&&d.s?d:null}catch(e){return null}}
function fmt(t){const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function saveSlot(i){try{localStorage.setItem("hyb3_s"+i,JSON.stringify({t:Date.now(),d:S.day,l:S.lives,s:JSON.parse(JSON.stringify(S))}));MSG="슬롯 "+i+"에 저장했어요."}catch(e){MSG="저장에 실패했어요."}render()}
function loadSlot(i){const d=slotInfo(i);if(!d)return;if(MG)closeMG();S=Object.assign(JSON.parse(FRESH),d.s);fix();MENU=false;save();render()}
function newGame(){if(!NG){NG=true;MSG="한 번 더 누르면 처음부터 시작해요. (슬롯은 그대로)";render();return}
 NG=false;try{localStorage.removeItem("hyb3")}catch(e){}if(MG)closeMG();S=JSON.parse(FRESH);fix();MENU=false;save();render()}
function exportCode(){try{const t=document.getElementById("code");t.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));t.select();note2("코드를 만들었어요. 복사해서 보관하세요.")}catch(e){note2("코드를 만들지 못했어요.")}}
function importCode(){try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById("code").value.trim()))));if(!o||typeof o.day!=="number")throw 0;
 if(MG)closeMG();S=Object.assign(JSON.parse(FRESH),o);fix();MENU=false;save();render()}catch(e){note2("코드가 올바르지 않아요.")}}
function menuHTML(){let rows="";for(let i=1;i<=3;i++){const d=slotInfo(i);rows+=`<div class="slot"><div><b>슬롯 ${i}</b><br><small>${d?`${d.d}일차 · 목숨 ${d.l??3} · ${fmt(d.t)}`:"비어 있음"}</small></div><div><button onclick="saveSlot(${i})">저장</button> <button onclick="loadSlot(${i})" ${d?"":"disabled"}>불러오기</button></div></div>`}
 return `<div class="modal" onclick="closeMenu()"><div class="mbox" onclick="event.stopPropagation()"><div class="mh"><b>${ic("disk")} 저장 / 불러오기</b><button onclick="closeMenu()">${ic("x")}</button></div><small>진행 상황은 자동으로도 저장돼요.</small>${rows}<div style="margin-top:8px"><b>코드로 옮기기</b></div><textarea id="code" rows="2" style="width:100%;box-sizing:border-box" placeholder="저장 코드를 붙여 넣으세요"></textarea><div class="mh" style="gap:4px"><button onclick="exportCode()">코드 만들기</button><button onclick="importCode()">코드로 불러오기</button><button onclick="newGame()">새 게임</button></div><div id="msg2" style="min-height:18px;font-size:12px">${MSG}</div></div></div>`}

function bub(){const t=S.phase==="prep"?(S.day===1?"사니와, 오기를 기다렸다. 약연 일은 내가 맡지. 먼저 약초밭에서 약재를 모아 두는 게 좋겠어. 처방을 틀릴 때마다 목숨이 하나씩 줄어. 셋을 다 잃으면 끝이다.":"약재는 충분한가, 대장?"):S.phase==="end"?"“"+S.say+"”":"“"+(S.say||"…")+"”";return `<span class="sayt" data-k="b" data-full="${esc(t)}">${ty(t,"b")}</span>`}
function mood(){return S.phase==="over"||Date.now()<(S.hurtUntil||0)?"hurt":"base"}
function yagen(c,m){return `<img class="ic ptr ${c||""}" src="${YIMG[m||"base"]}" alt="야겐 토시로">`}
const ICN={};

function expireUrg(p){if(MG)closeMG();const keep=S.sel!==p.id&&S.desk.some(x=>x.id===S.sel)?{sel:S.sel,pick:S.pick,proc:S.proc}:null;
 S.sel=p.id;S.lives=Math.max(0,S.lives-1);
 finish(`<span class="bad">${p.sp.n}의 긴급 처방전, 시간 초과! (${ic("bheart")} 목숨 -1)</span>`);
 if(keep&&S.phase!=="over"&&S.desk.some(x=>x.id===keep.sel)){S.sel=keep.sel;S.pick=keep.pick;S.proc=keep.proc;render()}}

function setM(k,m){S.proc[k]=m;render()}
function openMG(k,m){if(S.proc[k])return;const T={"썰기":"박자에 맞춰 3번 썸어요! 노란 막대가 초록 구간일 때 탭","빻기":"빠르게 연타해서 고우게 빻아요!","우리기":"꽓 누르고 있다가 초록 구간에서 손을 떼요"};
 MG={k,m,v:0,hits:0,dir:1,hold:false,down:0};

 const bt=m==="우리기"?'onpointerdown="event.preventDefault();mgHold(1)" onpointerup="mgHold(0)" onpointerleave="mgHold(0)" onpointercancel="mgHold(0)" oncontextmenu="return false"':'onpointerdown="event.preventDefault();mgAct()" oncontextmenu="return false"';
 const el=document.getElementById("mg");el.style.display="flex";
 el.innerHTML=`<div class="mbox" style="user-select:none;touch-action:manipulation"><div class="mh"><b>${HERBS[k].n} ${m}</b><button onclick="closeMG()">${ic("x")}</button></div><small>${T[m]}</small><canvas id="mgc" style="width:80%;margin-top:6px;border:4px solid var(--bd)"></canvas><div class="gauge"><div id="gz" style="${z}"></div><div id="gb"></div></div><div id="mgs" style="min-height:18px;font-size:13px"></div><button class="p" ${bt}>${m==="우리기"?"꽓 누르기":m+"!"}</button></div>`;

function mgAct(){const g=MG;if(!g)return;
 if(g.m==="썰기"){g.down=Date.now();if(g.v>=38&&g.v<=62){g.hits++;mgMsg(ic("ok")+" 좋아요! "+g.hits+"/3");if(g.hits>=3)mgDone()}else mgMsg(ic("no")+" 빗나갔어요")}

 if(S.phase==="day"||S.log)h+=`<div class="bar">${S.phase==="day"?`${yagen("s",mood())} 야겐: “<span class="sayt" data-k="r" data-full="${esc(S.say)}">${ty(S.say,"r")}</span>” <small>(${S.spawned}/${S.total}) <span id="nx"></span></small>`:""}${S.log?`<div>${S.log}</div>`:""}</div>`;
 if(S.tab==="field"){
  h+=`<div class="scene field"><div class="grid">`+Object.entries(HERBS).filter(([k])=>open(k)).map(([k,v])=>`<button class="plot" onclick="gather('${k}')"><canvas data-k="${k}" style="width:100%"></canvas>${v.n}<br><small>×${S.inv[k]||0}</small> <span id="gs_${k}"></span></button>`).join("")+`</div></div><div class="box"><small>익은 약초를 눌러 수확하면 일정 시간 뒤 다시 자랍니다.</small></div>`;
 }else if(S.tab==="desk"){
  h+=`<div class="bub" style="margin:10px 0"><b>${yagen("",mood())} 야겐 토시로</b><br>${bub()}</div>`;
  if(S.phase==="prep")h+=`<div class="box"><b>${ic("basket")} 보유 약재</b><br>${Object.entries(HERBS).filter(([k])=>open(k)).map(([k,v])=>`${v.n}×${S.inv[k]||0}`).join(" ")}<button class="p" onclick="startDay()">하루 일과 시작하기</button></div>`;
  else if(S.phase==="end")h+=`<div class="box"><button class="p" onclick="next()">다음 날로</button></div>`;
  else h+=`<div class="scene desk"><div class="papers">`+(S.desk.length?S.desk.map(p=>paper(p)).join(""):`<div class="note">처방전이 올 때까지 기다리는 중…<br>약초밭에서 약재를 모아 두자.</div>`)+`</div></div>`;
 }else{
  const p=S.desk.find(x=>x.id===S.sel);
  h+=`<div class="scene lab"><canvas id="pot" style="width:120px"></canvas><button class="bkbtn nbtn" onclick="toggleMemo()"><canvas id="np" style="width:46px"></canvas><small>메모장</small></button><button class="bkbtn" onclick="toggleBook()"><canvas id="bk" style="width:52px"></canvas><small>처방서</small></button></div>`;
  if(S.phase==="day"&&p){
   h+=`<div class="box"><div class="rx" style="margin:0 0 8px;padding:6px;border:4px solid #8a6a2f">${rxCard(p)}</div><b>약재 선택 (최대 ${MAXPICK})</b><div class="grid2" style="margin-top:6px">`+
   Object.entries(HERBS).filter(([k])=>open(k)).map(([k,v])=>`<button class="plot ${S.pick.includes(k)?"sel":""}" onclick="toggle('${k}')" ${!(S.inv[k]>0)?"disabled":""}><canvas data-k="${k}" data-g="1" style="width:50%"></canvas>${v.n}<br>×${S.inv[k]||0}</button>`).join("")+
   `</div>${procHTML()}<button class="p" onclick="brew()" ${S.pick.length&&S.pick.every(k=>S.proc[k])?"":"disabled"}>제조 완료</button><button style="width:100%;margin-top:6px" onclick="skip()">돌려보내기</button><small>※ 몸을 데우는 약재와 식히는 약재를 함께 쓰면 효과가 상쇄되고, 감초는 약효를 순하게 해요. 약재마다 맞는 손질법이 있으니 처방서를 확인하세요.</small></div>`;
  }else h+=`<div class="box"><small>책상에서 처방전을 골라 오세요.</small></div>`;
 }
 if(S.book)h+=bookHTML();if(S.memo)h+=memoHTML();if(S.notice)h+=noticeHTML();if(S.notice7)h+=notice7HTML();if(S.phase==="over")h+=overHTML();if(MENU)h+=menuHTML();

 $.innerHTML=h}
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
load();render();
</script></body></html>
