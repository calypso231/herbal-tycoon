 {a:"고열",b:"어지러움, 기운 없음",d:"고열 탈진",need:["청","기","혈"],rx:"jakyak+hwanggi|bakha+cheongung|bakha+hwanggi+danggwi",u:25}];

 if(S.taps>5&&S.teaseDay!==S.day){S.teaseDay=S.day;S.tease=true;S.tapSay=TEASE}
 else{S.tease=false;let l;do{l=rnd(TAPS)}while(l===S.tapSay&&TAPS.length>1);S.tapSay=l}
 save();render()}

let AC=null,NB=null,SND=true,WS=null,WT=null,BAT=[],BL=null,POURL=null;
try{SND=localStorage.getItem("hyb3_snd")!=="0"}catch(e){}
function ac(){if(!AC){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();const m=AC.createGain();m.gain.value=0.8;m.connect(AC.destination);AC.master=m;const n=AC.sampleRate;NB=AC.createBuffer(1,n,n);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){AC=null;return null}}
 if(AC.state==="suspended"){try{const r=AC.resume();if(r&&r.catch)r.catch(()=>{})}catch(e){}}return AC}
function unlockAudio(){if(SND)ac()}
function sTone(f,t,dur,type,vol,f2){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.master);o.start(t);o.stop(t+dur+0.03)}
function sSwish(t,dur,f1,f2,vol,att){const a=AC,x=a.createBufferSource();x.buffer=NB;x.loop=true;const f=a.createBiquadFilter();f.type="lowpass";f.Q.value=0.3;f.frequency.setValueAtTime(f1,t);f.frequency.linearRampToValueAtTime(f2,t+dur*0.5);f.frequency.linearRampToValueAtTime(f1,t+dur);const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.linearRampToValueAtTime(0,t+dur);x.connect(f);f.connect(g);g.connect(a.master);x.start(t,Math.random()*0.5);x.stop(t+dur+0.03)}
function sNoise(t,dur,type,freq,q,vol,f2){const a=AC,s=a.createBufferSource();s.buffer=NB;s.loop=true;const f=a.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);f.Q.value=q||1;const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(a.master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03)}
function sBell(t,f,v){sTone(f,t,1.4,"sine",v);sTone(f*2.76,t,0.7,"sine",v*0.35);sTone(f*5.4,t,0.32,"sine",v*0.14)}
const SFX={
 click(t){sTone(660,t,0.09,"sine",0.08,990);sTone(1480,t+0.045,0.1,"sine",0.04)},
 bell(t){sBell(t,1568,0.2);sBell(t+0.13,2093,0.17)},
 cut(t,m){const v=m||1;sNoise(t,0.08,"bandpass",3200,0.9,0.45*v,1500);sNoise(t+0.01,0.05,"highpass",6500,0.6,0.1*v);sTone(180,t,0.1,"triangle",0.32*v,65)},
 hit(t){sTone(1175,t+0.05,0.18,"sine",0.14);sTone(1568,t+0.1,0.22,"sine",0.1)},
 miss(t){sTone(220,t,0.16,"triangle",0.16,150)},
 grind(t){const r=0.9+Math.random()*0.25;sNoise(t,0.14,"lowpass",900*r,0.7,0.5,450);sNoise(t+0.02,0.1,"bandpass",1700*r,1.4,0.16);sTone(105*r,t,0.12,"sine",0.28,62)},
 done(t){sTone(659,t,0.14,"sine",0.16);sTone(988,t+0.09,0.24,"sine",0.14)},
 gather(t){sTone(480,t,0.1,"sine",0.2,860);sNoise(t,0.05,"bandpass",5200,1,0.1)},
 page(t){sSwish(t,0.28,700,1500,0.14,0.09);sSwish(t+0.2,0.22,600,1100,0.09,0.07)},
 success(t){[523,659,784,1047].forEach((f,i)=>{sTone(f,t+i*0.085,0.28,"sine",0.17);sTone(f*2,t+i*0.085,0.18,"sine",0.04)})},
 soft(t){sTone(587,t,0.16,"sine",0.14);sTone(698,t+0.1,0.22,"sine",0.12)},
 hurt(t){sTone(196,t,0.4,"triangle",0.26,140);sTone(147,t+0.14,0.45,"triangle",0.22,105)},
 over(t){[392,330,262,196].forEach((f,i)=>sTone(f,t+i*0.26,0.5,"triangle",0.2,f*0.93))},
 start(t){[392,523,659].forEach((f,i)=>sTone(f,t+i*0.1,0.3,"sine",0.17));sBell(t+0.3,1319,0.08)},
 urgent(t){[0,0.17,0.34,0.51].forEach((d,i)=>sTone(i%2?660:880,t+d,0.14,"triangle",0.14))},
 drop(t){sTone(150,t,0.09,"triangle",0.28,80);sNoise(t,0.06,"lowpass",900,0.8,0.18)},
 plop(t){sTone(420+Math.random()*80,t,0.13,"sine",0.22,130);sNoise(t,0.1,"bandpass",1500,1,0.14,600)},
 boil(t){const n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++){const o=Math.random()*0.12,f=200+Math.random()*380;sTone(f,t+o,0.07+Math.random()*0.03,"sine",0.13,f*(1.7+Math.random()*0.9));if(Math.random()<0.45)sNoise(t+o+0.055,0.025,"highpass",3200,0.5,0.035)}},
 bubble(t){sTone(280+Math.random()*280,t,0.08,"sine",0.1,650+Math.random()*350)},
 ting(t){sBell(t,2637,0.13)},
 star(t){[1568,2093,2637].forEach((f,i)=>sTone(f,t+i*0.07,0.3,"sine",0.1))},
 crackle(t){sNoise(t,0.03,"highpass",3800,0.7,0.07+Math.random()*0.1)}
};
function sfx(n,a){if(!SND)return;const c=ac();if(!c||!SFX[n])return;try{SFX[n](c.currentTime+0.01,a)}catch(e){}}
function sLoop(type,freq,q,vol){if(!SND)return null;const a=ac();if(!a)return null;try{const s=a.createBufferSource();s.buffer=NB;s.loop=true;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(0.0001,a.currentTime);g.gain.linearRampToValueAtTime(vol,a.currentTime+0.15);s.connect(f);f.connect(g);g.connect(a.master);s.start();return{stop(){try{const n=a.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(Math.max(g.gain.value,0.0001),n);g.gain.linearRampToValueAtTime(0.0001,n+0.12);s.stop(n+0.14)}catch(e){}}}}catch(e){return null}}
